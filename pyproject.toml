[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "legalmath"
version = "0.1.0"
description = "Source-linked regulatory rules and deterministic Java delivery"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonschema==4.26.0", "pydantic==2.12.5", "fastapi==0.135.1", "uvicorn==0.43.0", "httpx==0.28.1", "pypdf==6.8.0", "Jinja2==3.1.6", "z3-solver==4.16.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "hypothesis==6.151.9", "playwright==1.58.0"]

[project.scripts]
legalmath = "legalmath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalmath = ["schemas/*.json", "storage/migrations/*.sql", "web/templates/*.html", "web/static/*", "java/runtime/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
